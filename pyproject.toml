[project]
name = "audiotool"
version = "0.1.0"
description = "Turn a song into tracks an AI can read: loudness, notes, beats, stems, lyrics, sections."
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
  "torch==2.11.0",          # must equal torchaudio's version (ABI-locked .so)
  "torchaudio==2.11.0",     # fallback separator (HDEMUCS_HIGH_MUSDB_PLUS); never used for audio I/O
  "demucs==4.1.0",          # primary separator, weights from HF adefossez/HTDemucs
  "beat-this==1.1.0",
  "basic-pitch==0.4.0",     # runs its bundled nmp.onnx through onnxruntime
  "onnxruntime>=1.20,<2",
  "faster-whisper==1.2.1",
  "huggingface-hub>=1.0,<3",
  "librosa>=1.0,<1.1",
  "numpy>=2.1,<2.6",        # numba import-time cap
  "scipy>=1.14",
  "scikit-learn>=1.5",
  "soundfile>=0.13",
  "soxr>=0.5",
  "pyloudnorm==0.2.0",
  "pretty-midi>=0.2.11",
  "mido>=1.3",
  "matplotlib>=3.10",
  "setuptools<82",          # resampy (basic-pitch) imports pkg_resources
]

[project.scripts]
audiotool = "audiotool.cli:main"

[dependency-groups]
dev = ["pytest>=9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["audiotool"]

[tool.uv]
exclude-dependencies = ["tensorflow", "tensorflow-macos", "tflite-runtime", "coremltools"]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: downloads models / heavy CPU; enable with --slow"]
